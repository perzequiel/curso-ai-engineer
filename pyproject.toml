[project]
name = "curso-ai-engineer"
version = "0.1.0"
description = "Curso de AI Engineer - Code Review System con arquitectura Ports & Adapters"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.0.10",
    "PyGithub>=2.1.0",
    "astroid>=3.0.0",
    "python-dotenv>=1.0.0",
    "langchain-openai>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "langgraph-cli[inmem]>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
